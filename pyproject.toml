[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonyatique-cost_throughput_pareto_schema_check"
version = "0.1.0"
description = "从样本里推断自动驾驶感知工程师·成本与吞吐的帕累托边界应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tonyatique" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tonyatique.github.io"
Repository = "https://github.com/tonyatique/cost_throughput_pareto_schema_check"
Issues = "https://github.com/tonyatique/cost_throughput_pareto_schema_check/issues"

[project.scripts]
cost_throughput_pareto_schema_check = "cost_throughput_pareto_schema_check:main"

[tool.setuptools]
py-modules = ["cost_throughput_pareto_schema_check"]
